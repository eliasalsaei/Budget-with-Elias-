<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget with Elias</title>
  <meta name="description" content="Colourful budgeting, spending and debt tracker in BHD.">
  <meta name="theme-color" content="#257a70">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M16 13h2M3 10h18"/></svg></span>
        <div>
          <div class="brand-name">Budget with Elias</div>
          <div class="brand-sub">BHD money tracker</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="lbl-long">Dashboard</span><span class="lbl-short">Home</span></button>
        <button class="nav-item" data-view="transactions"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span><span class="lbl-long">Transactions</span><span class="lbl-short">Activity</span></button>
        <button class="nav-item" data-view="budgets"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span><span>Budgets</span></button>
        <button class="nav-item" data-view="debts"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg></span><span>Debts</span></button>
        <button class="nav-item" data-view="savings"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M16 15h2"/><path d="M7 6V4.5h10V6"/></svg></span><span>Savings</span></button>
        <button class="nav-item" data-view="plan"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3"/></svg></span><span>Plan</span></button>
        <button class="nav-item" data-view="insights"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg></span><span>Insights</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-actions">
        <button class="btn btn-expense block" data-action="add-expense">Add expense</button>
        <button class="btn btn-income block" data-action="add-income">Add income</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-row">
          <h1 class="view-title" id="viewTitle">Dashboard</h1>
          <button class="sync-badge" id="syncBadge" data-action="goto" data-view="settings"></button>
        </div>
        <div class="month-switch">
          <button class="icon-btn" id="prevMonth" aria-label="Previous month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="month-label" id="monthLabel" title="Go to current month">—</button>
          <button class="icon-btn" id="nextMonth" aria-label="Next month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="icon-btn" id="editPeriod" aria-label="Adjust when this month starts" title="Adjust when this month starts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <button class="fab" data-action="add-expense" aria-label="Add transaction"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <dialog id="modal" class="modal">
    <div class="modal-inner" id="modalBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
